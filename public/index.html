.fxskip{text-align:center;color:#56627d;font-size:11px;margin-top:10px}
.fx.flash .fxstage{animation:flash .35s,shake .4s}

/* Saves antigos (6 patentes) → novas 9 patentes, sem rebaixar ninguém */
function normalizePlayer(p){
  if(!p||p.v2) return p;
  const oldMins=[0,2,4,6,8,10], map=[0,2,3,5,6,8];
  let oi=0; oldMins.forEach((m,i)=>{if((p.solved||0)>=m)oi=i;});
  const extra=(p.solved||0)-oldMins[oi];
  p.solved = oi===5 ? RANKS[8].min+extra : RANKS[map[oi]].min+Math.min(1,extra);
  p.v2=true; return p;
}

const DAYS_LONG = ["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
function prazoOf(C){return (C&&C.prazo)||DEADLINE_T;}
function fmtPrazoCurto(t){return `${DAYS[Math.floor(t/24)].slice(0,3)} ${String(t%24).padStart(2,"0")}:00`;}
function fmtPrazoLongo(t){return `${DAYS_LONG[Math.floor(t/24)]} às ${String(t%24).padStart(2,"0")}:00`;}

const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function g(text, sexo){ // concordância de gênero
  const f = sexo==="Feminino";
  return text.replace(/\{Ele\}/g,f?"Ela":"Ele").replace(/\{ele\}/g,f?"ela":"ele")
             .replace(/\{o\}/g,f?"a":"o").replace(/\{a\}/g,f?"a":"");
}
function fmtTime(t){const d=Math.floor(t/24),h=t%24;return `${DAYS[Math.min(d,6)]}, ${String(h).padStart(2,"0")}:00`;}
function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function travelHours(a,b){return Math.min(9,Math.max(2,Math.round(distKm(CITY[a],CITY[b])/1500)+1));}
function rankOf(solved){let r=RANKS[0];for(const k of RANKS) if(solved>=k.min) r=k;return r;}
function rankIndex(solved){let i=0;RANKS.forEach((k,j)=>{if(solved>=k.min)i=j;});return i;}

let duckTimer=null;
function duckMusic(ms){
  if(!AC||typeof MS==="undefined"||!MS.master) return;
  const g=MS.master.gain, now=AC.currentTime;
  g.cancelScheduledValues(now); g.setTargetAtTime(MUSIC_BASE*DUCK_LEVEL,now,0.03);
  clearTimeout(duckTimer);
  duckTimer=setTimeout(()=>{try{MS.master.gain.setTargetAtTime(MUSIC_BASE,AC.currentTime,0.3);}catch(e){}},ms);
}

}

/* =========================================================
   GERAÇÃO DO CASO
   ========================================================= */
function uniqueWith(sus, keys){
  return GANG.filter(o=>keys.every(k=>o[k]===sus[k])).length===1;
}
function newCase(){
  const p=S.player, ri=rankIndex(p.solved), rank=RANKS[ri];
  let suspect;
  const carmenTime = ri===RANKS.length-1 && (!p.carmenPresa || Math.random()<0.2);
  if(carmenTime) suspect=GANG[0];
  else suspect=pick(GANG.slice(1));
  const L=rank.rota;
  const route=shuffle(CITIES.map(c=>c.id)).slice(0,L);
  // Planejamento de pistas sobre o suspeito (garantindo identificação única)
  const others=["cabelo","hobby","marca","veiculo"];
  const slots=Math.min(4,L-1);
  let plan=null;
  for(let tries=0;tries<50;tries++){
    const perm=shuffle(others).slice(0,slots);
    if(uniqueWith(suspect,["sexo",...perm])){plan=perm;break;}
  }
  if(!plan) plan=others.slice(0,slots);
  const traitAt={}; // índice da cidade na rota → traço revelado
  const idxs=shuffle([...Array(L-1).keys()]).slice(0,plan.length);
  idxs.forEach((ci,k)=>traitAt[ci]=plan[k]);

  S.caso={
    suspect:suspect.id, route, traitAt,
    loot:CITY[route[0]].tesouro,
    cur:route[0], lastGood:0, t:START_T,
    warrant:null, visits:{}, cityData:{}, options:{},
    notes:[], known:{sexo:suspect.sexo}, trail:[route[0]],
    status:"briefing", carmen: suspect.id==="carmen", prazo: rank.prazo
  };
  S.tab="cidade"; S.msg=null;
  save();
}

/* Dados de cada cidade (locais e falas) — gerados uma vez por caso */
function cityData(id){
  const C=S.caso;
  if(C.cityData[id]) return C.cityData[id];
  const ri=C.route.indexOf(id), sus=GANG.find(x=>x.id===C.suspect);
  const places=shuffle(PLACES.map(p=>p.id)).slice(0,3);
  let locs;
  if(ri===-1){
    locs=places.map(pl=>({pl,type:"wrong",text:pick(WRONG_LINES)}));
  } else if(ri===C.route.length-1){
    const hide=rnd(3), atk=(hide+1+rnd(2))%3;
    locs=places.map((pl,i)=>i===hide?{pl,type:"capture"}:
      {pl,type:"near",text:g(pick(NEAR_LINES),sus.sexo),attack:i===atk?rnd(ATTACKS.length):null});
  } else {
    const next=CITY[C.route[ri+1]];
    const clues=shuffle(next.pistas).slice(0,3);
    const tr=C.traitAt[ri]; const trLoc=rnd(3);
    const atk = ri>0 && Math.random()<0.4 ? rnd(3) : -1;
    locs=places.map((pl,i)=>({pl,type:"clue",text:g(clues[i],sus.sexo),
      trait: i===trLoc&&tr ? tr : null,
      traitText: i===trLoc&&tr ? g(TRAIT_CLUE[tr][sus[tr]],sus.sexo) : null,
      attack: i===atk ? rnd(ATTACKS.length) : null}));
    // Patentes altas: uma testemunha pode ser informante da V.I.L.E. e apontar uma cidade falsa
    if(S.player && rankIndex(S.player.solved)>=FALSE_CLUE_RANK && Math.random()<0.35){
      const decoys=travelOptions(id).filter(x=>x!==C.route[ri+1]&&x!==C.route[ri-1]);
      if(decoys.length){const fi=(trLoc+1+rnd(2))%3; locs[fi].text=g(pick(CITY[pick(decoys)].pistas),sus.sexo); locs[fi].falsa=true;}
    }
  }
  C.cityData[id]={locs,seen:[]};
  return C.cityData[id];
}

/* Destinos de viagem — fixos por cidade dentro do caso */
function travelOptions(id){
  const C=S.caso;
  if(C.options[id]) return C.options[id];
  const ri=C.route.indexOf(id);
  const must=[];
  if(ri===-1) must.push(C.route[C.lastGood]);
  else{
    if(ri<C.route.length-1) must.push(C.route[ri+1]);
    if(ri>0) must.push(C.route[ri-1]);
  }
  const pool=shuffle(CITIES.map(c=>c.id).filter(x=>x!==id && !C.route.includes(x)));
  const opts=must.slice();
  while(opts.length<4) opts.push(pool.pop());
  C.options[id]=shuffle(opts);
  return C.options[id];
}

/* =========================================================
   TEMPO
   ========================================================= */
function spend(h){
  const C=S.caso; let slept=false;
  C.t+=h;
  const hr=C.t%24;
  if(hr>=23||hr<7){
    const day=Math.floor(C.t/24);
    C.t = hr>=23 ? (day+1)*24+7 : day*24+7;
    slept=true;
  }
  if(C.t>prazoOf(C)){C.t=prazoOf(C);endCase("tempo");return {slept,over:true};}
  return {slept,over:false};
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function TRI(c,cx,top,base,hw,col){const n=base-top;for(let i=0;i<=n;i++){const w=Math.round(hw*i/n);R(c,cx-w,top+i,w*2+1,1,col);}}
function CIRC(c,cx,cy,r,col,upper){for(let dy=-r;dy<=(upper?0:r);dy++){const w=Math.round(Math.sqrt(r*r-dy*dy));R(c,cx-w,cy+dy,w*2+1,1,col);}}
function SPR(c,rows,pal,x,y,flip){for(let j=0;j<rows.length;j++){const row=rows[j];for(let i=0;i<row.length;i++){const ch=row[flip?row.length-1-i:i];if(ch!=="."&&pal[ch]) R(c,x+i,y+j,1,1,pal[ch]);}}}

function skyPhase(h){if(h>=19||h<6)return"noite";if(h>=17||h<7)return"tarde";return"dia";}
const SKY={dia:["#29adff","#45b8ff","#62c4ff","#82d1ff","#a6defc","#c7ecff"],
  tarde:["#2b1d4d","#5a2d6b","#a3416b","#e0634f","#f39a4a","#ffcd75"],
  noite:["#070b18","#0b1124","#0f1730","#141d3b","#1a2447","#202b52"]};
function drawSky(c,h,t,H,seed){
  const ph=skyPhase(h), b=SKY[ph], bh=Math.ceil(H/b.length);
  b.forEach((col,i)=>{R(c,0,i*bh,FW,bh,col); if(i>0) for(let x=(i%2);x<FW;x+=2) R(c,x,i*bh,1,1,b[i-1]);});
  if(ph==="noite"){
    const rng=mulberry(seed||7);
    for(let i=0;i<40;i++){const x=rng()*FW|0,y=rng()*H*0.6|0,tw=Math.sin(t*3+i*1.7);R(c,x,y,1,1,tw>0.6?"#ffffff":"#7b86a8");}
    CIRC(c,132,13,6,"#f4f1d0");CIRC(c,135,11,5,b[0]);
  } else {
    if(ph==="dia") CIRC(c,22,14,7,"#fff1a8"); else CIRC(c,26,H*0.55,9,"#ffd27a");
    const cc=ph==="dia"?"#ffffff":"#ffc7a6";
    for(let i=0;i<3;i++){const x=((i*70+t*(4+i*2))%(FW+40))-30, y=8+i*9; cloud(c,x,y,cc);}
  }
  return ph;
}
function cloud(c,x,y,col){R(c,x,y+3,24,4,col);R(c,x+4,y,11,4,col);R(c,x+13,y+1,8,3,col);}

const SKY_CACHE={};
function cityBlocks(id){
  if(SKY_CACHE[id]) return SKY_CACHE[id];
  const rng=mulberry(hashStr(id)), hue=Math.floor(rng()*360), bl=[];
  let x=-6;
  while(x<FW+20){const w=6+Math.floor(rng()*9),h=7+Math.floor(rng()*17),wins=[];
    for(let yy=3;yy<h-2;yy+=3) for(let xx=2;xx<w-1;xx+=3) wins.push([xx,yy,rng()]);
    bl.push({x,w,h,l:22+Math.floor(rng()*14),wins}); x+=w+(rng()<0.3?1:0);}
  return SKY_CACHE[id]={hue,bl};
}

function playScene(sc){return new Promise(res=>{
  const fx=$("#fx"),cv=$("#fxc"),c=cv.getContext("2d");
  cv.height=90;
  $("#fxcap").innerHTML=sc.cap||"";
  const sg=$("#fxsign");sg.textContent=sc.sign||"";sg.style.display=sc.sign?"":"none";
  const bar=$("#fxbar i");bar.style.transition="none";bar.style.width="0%";void bar.offsetWidth;
  bar.style.transition=`width ${sc.dur}s linear`;bar.style.width="100%";
  fx.classList.remove("hide");
  const fired=new Set();let start=null,done=false;
  const api={once(k,fn){if(!fired.has(k)){fired.add(k);fn();}},cap(h){$("#fxcap").innerHTML=h;}};
  const finish=()=>{if(done)return;done=true;fx.onclick=null;res();};
  fx.onclick=finish;
  (function frame(now){if(done)return;if(start===null)start=now;const t=(now-start)/1000;
    if(t>=sc.dur){sc.draw(c,sc.dur,api);setTimeout(finish,sc.hold||250);return;}
    sc.draw(c,t,api);requestAnimationFrame(frame);})(performance.now());
});}
async function playAll(list){

}

let TYPE_TOKEN=0;
function typeAll(){
  const tok=++TYPE_TOKEN;const els=[...document.querySelectorAll("[data-type]")];
  const texts=els.map(e=>e.textContent);els.forEach(e=>{e.textContent="";e.classList.add("typing");});
  let i=0,j=0,skip=false;
  const host=els[0]&&els[0].closest(".card");if(host)host.addEventListener("click",()=>{skip=true;},{once:true});
  (function step(){if(tok!==TYPE_TOKEN)return;
    if(i>=els.length)return;
    if(skip){els.forEach((e,k)=>{e.textContent=texts[k];e.classList.remove("typing");});return;}
    const s=texts[i];j+=2;els[i].textContent=s.slice(0,j);if(j%6===0)beep(1200,.015,"square",.012);
    if(j>=s.length){els[i].textContent=s;els[i].classList.remove("typing");i++;j=0;}
    setTimeout(step,22);})();
}

  const add=(line,ch)=>{if(!line)return;const p=parseLine(line);for(let r=0;r<L;r+=p.n)p.ev.forEach(e=>{if(r+e.s<L)steps[r+e.s].push({ch,m:e.m+tr,len:e.len});});};

  const dr=tokens(T.drums),fl=T.fill?tokens(T.fill):null;
  for(let i=0;i<L;i++){const bar=Math.floor(i/T.bar),last=(bar%4)===3;const d=(last&&fl?fl:dr)[i%T.bar];if(d&&d!==".")steps[i].push({ch:"drum",d});}

function noiseBuf(ac){if(MS.noise)return MS.noise;const b=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return MS.noise=b;}
function mNote(ac,dest,type,midi,t,dur,vol){
  const o=waveOsc(ac,type),g=ac.createGain();o.frequency.value=440*Math.pow(2,(midi-69)/12);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.setValueAtTime(vol*0.75,t+Math.min(dur*0.4,0.08));
  g.gain.setValueAtTime(vol*0.75,t+dur*0.9);g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.02);
}
function mDrum(ac,dest,d,t){
  if(d==="k"){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.32,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);o.connect(g);g.connect(dest);o.start(t);o.stop(t+0.16);return;}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf(ac);f.type="highpass";
  f.frequency.value=d==="s"?1400:7000;const len=d==="s"?0.12:0.035;
  g.gain.setValueAtTime(d==="s"?0.12:0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+len+0.01);
}
function musicTick(){
  const ac=AC,th=MS.th;if(!ac||!th)return;
  const sd=60/th.bpm/2;
  if(MS.next<ac.currentTime-0.2)MS.next=ac.currentTime+0.05;
  while(MS.next<ac.currentTime+0.15){
    const t=MS.next+(th.swing&&MS.step%2?sd*0.22:0);
    th.steps[MS.step].forEach(e=>{
      if(e.ch==="drum")mDrum(ac,MS.gain,e.d,t);
      else if(e.ch==="lead")mNote(ac,MS.gain,th.lw,e.m,t,e.len*sd*0.95,0.055);
      else if(e.ch==="harm")mNote(ac,MS.gain,"p50",e.m,t,e.len*sd*0.95,0.025);
      else mNote(ac,MS.gain,th.bw,e.m,t,e.len*sd*0.9,th.bw==="tri"?0.11:0.04);
    });
    MS.next+=sd;MS.step=(MS.step+1)%th.L;
  }
}
function setMusic(key){
  if(!musicOn())key=null;
  if(key===MS.id)return;
  MS.id=key;
  let ac;try{ac=getAC();}catch(e){return;}
  if(!MS.master){MS.master=ac.createGain();MS.master.gain.value=MUSIC_BASE;MS.master.connect(ac.destination);}
  if(MS.gain){const old=MS.gain;old.gain.setTargetAtTime(0.0001,ac.currentTime,0.15);setTimeout(()=>{try{old.disconnect();}catch(e){}},1200);}
  MS.gain=null;MS.th=null;
  if(!key){if(MS.timer){clearInterval(MS.timer);MS.timer=null;}return;}
  const [kind,cid]=key.split(":");
  const themeId=kind==="city"?(CITY_THEME[cid]||"title"):key;
  MS.th=compileTheme(themeId,kind==="city"?cid:null);
  MS.gain=ac.createGain();MS.gain.gain.setValueAtTime(0.0001,ac.currentTime);MS.gain.gain.setTargetAtTime(1,ac.currentTime+0.05,0.2);MS.gain.connect(MS.master);
  MS.step=0;MS.next=ac.currentTime+0.15;
  if(!MS.timer)MS.timer=setInterval(musicTick,30);
}

/* =========================================================
   NUVEM (Cloudflare Worker + KV) — igual ao Fabricio Finance:
   usuário + senha → PBKDF2 (600 mil iterações) → 512 bits
     256 bits = chave AES-GCM (o progresso é cifrado no aparelho)
     256 bits = token de acesso (o servidor só confere o SHA-256 dele com o segredo SAVE_AUTH_HASH)
   Só aparece quando o jogo roda no próprio domínio (com /api/status respondendo).
   ========================================================= */
const CLOUD={avail:false,status:null,sess:null,rev:0,state:"off",timer:null,pushing:false,dirty:false,last:0,busyLogin:false,err:""};
const SESS_KEY="carmen_cloud_v1";
const te=new TextEncoder(),td=new TextDecoder();
const toHex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("");
const toB64=u=>{u=new Uint8Array(u);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(s);};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha256Hex(t){return toHex(await crypto.subtle.digest("SHA-256",te.encode(t)));}
async function deriveSess(user,pass){
  const base=await crypto.subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",
    salt:te.encode("carmen-sandiego:v1:"+user.trim().toLowerCase()),iterations:600000},base,512));
  const sess={user:user.trim(),key:toB64(bits.slice(0,32)),token:toHex(bits.slice(32))};
  bits.fill(0);
  sess.hash=await sha256Hex(sess.token);
  return sess;
}
let AES=null;
async function aesKey(){if(!AES)AES=await crypto.subtle.importKey("raw",fromB64(CLOUD.sess.key),{name:"AES-GCM"},false,["encrypt","decrypt"]);return AES;}
async function encryptObj(o){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await aesKey(),te.encode(JSON.stringify(o)));return {v:1,iv:toB64(iv),ct:toB64(ct)};}
async function decryptObj(b){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(b.iv)},await aesKey(),fromB64(b.ct));return JSON.parse(td.decode(pt));}
function apiSave(method,body,keepalive){
  const h={"Authorization":"Bearer "+CLOUD.sess.token};if(body)h["Content-Type"]="application/json";
  return fetch("/api/save",{method,headers:h,body:body?JSON.stringify(body):undefined,cache:"no-store",keepalive:!!keepalive});
}
function cloudSetState(st,err){CLOUD.state=st;CLOUD.err=err||"";if(st==="ok")CLOUD.last=Date.now();refreshCloudUI();}
function refreshCloudUI(){
  const b=document.getElementById("cloudBadge");if(b)b.outerHTML=cloudBadge();
  const box=document.getElementById("cloudBox");if(box&&!CLOUD.busyLogin){box.outerHTML=cloudBox();bindCloud();}
}
function snapshot(){return {player:S.player,caso:S.caso,updatedAt:S.updatedAt||0};}
function applyRemote(d){
  S.player=normalizePlayer(d.player||null);S.caso=d.caso||null;S.updatedAt=d.updatedAt||0;
  S.msg=null;S.sel=null;S.dossieMsg=null;S.showTravel=false;S.tab="cidade";
  saveLocal();
  if(!BUSY){render();toast("☁️ Progresso trazido da nuvem");}
}
async function cloudInit(){
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),5000);
    const r=await fetch("/api/status",{cache:"no-store",signal:ctl.signal});
    const j=await r.json();
    if(typeof j!=="object"||!("kv" in j))return;
    CLOUD.avail=true;CLOUD.status=j;
  }catch(e){return;}
  try{CLOUD.sess=JSON.parse(localStorage.getItem(SESS_KEY)||"null");}catch(e){}
  if(CLOUD.sess)await cloudPull();
  if(!BUSY)render();
}
async function cloudPull(){
  if(!CLOUD.sess)return;
  cloudSetState("sync");
  try{
    const r=await apiSave("GET");
    if(r.status===401)return cloudSetState("auth");
    if(r.status===503){CLOUD.status=await r.json().catch(()=>CLOUD.status);return cloudSetState("setup");}
    if(r.status===204){CLOUD.rev=0;cloudSetState("ok");if(S.player)scheduleCloud(100);return;}
    if(!r.ok)return cloudSetState("erro","Resposta "+r.status);
    const j=await r.json();CLOUD.rev=j.rev;
    let d;try{d=await decryptObj(j.blob);}catch(e){return cloudSetState("auth","Não foi possível abrir o progresso salvo. Confira usuário e senha.");}
    if((d.updatedAt||0)>(S.updatedAt||0)||!S.player)applyRemote(d);
    else if((d.updatedAt||0)<(S.updatedAt||0))scheduleCloud(100);
    cloudSetState("ok");
  }catch(e){cloudSetState("offline");}
}
function scheduleCloud(ms){
  if(!CLOUD.avail||!CLOUD.sess)return;
  CLOUD.dirty=true;clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(()=>cloudPush(false),ms==null?2500:ms);
}
async function cloudPush(keepalive){
  if(!CLOUD.sess||!CLOUD.dirty)return;
  if(CLOUD.pushing){CLOUD.timer=setTimeout(()=>cloudPush(false),800);return;}
  if(CLOUD.state==="auth"||CLOUD.state==="setup")return;
  CLOUD.pushing=true;CLOUD.dirty=false;cloudSetState("sync");
  try{
    const blob=await encryptObj(snapshot());
    const r=await apiSave("PUT",{baseRev:CLOUD.rev,blob},keepalive);
    if(r.status===200){CLOUD.rev=(await r.json()).rev;cloudSetState("ok");}
    else if(r.status===409){
      const j=await r.json();CLOUD.rev=j.rev;
      let d=null;try{if(j.blob)d=await decryptObj(j.blob);}catch(e){}
      if(d&&(d.updatedAt||0)>(S.updatedAt||0))applyRemote(d);else CLOUD.dirty=true;
      cloudSetState("ok");
    }
    else if(r.status===401){CLOUD.dirty=true;cloudSetState("auth");}
    else if(r.status===503){CLOUD.dirty=true;cloudSetState("setup");}
    else{CLOUD.dirty=true;cloudSetState("erro","Resposta "+r.status);}
  }catch(e){CLOUD.dirty=true;cloudSetState("offline");}
  finally{CLOUD.pushing=false;if(CLOUD.dirty&&CLOUD.state==="ok")scheduleCloud(500);}
}
async function cloudLogin(user,pass){
  if(!user.trim()||pass.length<6){CLOUD.err="Informe um usuário e uma senha com pelo menos 6 caracteres.";refreshCloudUI();return;}
  CLOUD.busyLogin=true;
  const box=document.getElementById("cloudBox");if(box)box.querySelector("#cLogin").innerHTML=`<span class="ic">⏳</span><span>Gerando chave segura…</span>`;
  try{
    const s=await deriveSess(user,pass);
    CLOUD.sess=s;AES=null;
    try{localStorage.setItem(SESS_KEY,JSON.stringify(s));}catch(e){}
  }finally{CLOUD.busyLogin=false;}
  await cloudPull();
  refreshCloudUI();
}
function cloudLogout(){
  CLOUD.sess=null;AES=null;CLOUD.rev=0;CLOUD.state="off";CLOUD.err="";
  try{localStorage.removeItem(SESS_KEY);}catch(e){}
  render();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&CLOUD.dirty){clearTimeout(CLOUD.timer);cloudPush(true);}});
window.addEventListener("online",()=>{if(CLOUD.sess&&CLOUD.state==="offline")cloudPull();});

let BUSY=false;
async function investigate(i){
  const C=S.caso; if(BUSY||C.status!=="jogando") return;
  sfx.click();
  const d=cityData(C.cur), L=d.locs[i], pl=PLACE[L.pl], hour0=C.t%24, city=C.cur;
  const first=!d.seen.includes(i);
  let cost=1;
  if(first){ cost=[1,2,2][C.visits[C.cur]||0]||2; C.visits[C.cur]=(C.visits[C.cur]||0)+1; d.seen.push(i);}
  const atkIdx=first&&L.attack!=null?L.attack:null;
  const iev=first&&atkIdx==null&&L.type!=="capture"&&Math.random()<0.12?pick(INV_EVENTS):null;
  const extra=(atkIdx!=null?ATTACKS[atkIdx].h:0)+(iev?iev.h:0);
  const scenes=[()=>sceneInvestigate(city,L.pl,hour0,atkIdx)];
  const r=spend(Math.max(1,cost+extra));
  if(r.over){ setMusic(null); scenes.push(()=>sceneTimeout()); }
  else if(L.type==="capture"){
    setMusic(null);
    const sus=GANG.find(x=>x.id===C.suspect);
    const out=C.warrant===sus.id?"preso":(C.warrant?"errado":"semmandado");
    scenes.push(()=>sceneCapture(city,out,hour0));
    endCase(out);
  } else {
    const sus=GANG.find(x=>x.id===C.suspect);
    let html=`<div class="who">${pl.ic} ${esc(pl.quem)}</div>`;
    if(atkIdx!=null) html+=`<div class="say warn" data-type>⚠️ ${esc(ATTACKS[atkIdx].t)}</div><div style="height:8px"></div>`;
    html+=`<div class="say" data-type>“${esc(L.text)}${L.traitText?" "+esc(L.traitText):""}”</div>`;
    if(iev) html+=`<div class="sys">${iev.h<0?"🍀":"⏳"} ${esc(iev.t)}</div>`;
    if(r.slept){html+=`<div class="sys">🌙 Já era tarde. Você dormiu no hotel e acordou às 07:00.</div>`;scenes.push(()=>sceneSleep(city));}
    S.msg=html; S.fresh=true;
    if(first){
      if(L.type==="clue"||L.type==="near") C.notes.push({city:C.cur,place:pl.nome,text:L.text+(L.traitText?" "+L.traitText:"")});
      if(L.trait) C.known[L.trait]=sus[L.trait];
    }
  }
  save();
  await playAll(scenes);
  render();
}

async function travel(dest){
  const C=S.caso; if(BUSY||C.status!=="jogando") return;
  setMusic(null);
  const from=C.cur, base=travelHours(from,dest), hour0=C.t%24;
  const ev=Math.random()<0.2?pick(TRAVEL_EVENTS):null;
  const h=Math.max(1,base+(ev?ev.h:0));
  C.cur=dest; C.trail.push(dest);
  const ri=C.route.indexOf(dest); if(ri>=0) C.lastGood=ri;
  const r=spend(h);
  const scenes=[()=>sceneTravel(from,dest,h,hour0,ev)];
  if(r.over) scenes.push(()=>sceneTimeout());
  else{
    S.msg=`<div class="who">✈️ Viagem</div><div class="say" data-type>Você voou ${h} horas e desembarcou em ${CITY[dest].nome}.</div>`+
      (ev?`<div class="sys">${ev.h<0?"🍀":"⚠️"} ${esc(ev.t)}</div>`:"")+
      (r.slept?`<div class="sys">🌙 Você chegou tarde e dormiu até as 07:00.</div>`:"");
    S.fresh=true;
    if(r.slept) scenes.push(()=>sceneSleep(dest));
  }
  S.tab="cidade"; S.showTravel=false;
  save();
  await playAll(scenes);
  render();
}

async function computeWarrant(sel){
  const C=S.caso; if(BUSY) return;
  const keys=TRAIT_ORDER.filter(k=>sel[k]);
  const matches=GANG.filter(o=>keys.every(k=>o[k]===sel[k]));
  const r=spend(1);
  if(r.over){save();await playAll([()=>sceneTimeout()]);render();return;}
  if(matches.length===1 && keys.length>0){
    C.warrant=matches[0].id;
    S.dossieMsg=`<b>Mandado de prisão emitido</b> contra <b>${esc(matches[0].nome)}</b>.`;
    save(); BUSY=true; await playStamp(matches[0].nome); BUSY=false;
  } else if(matches.length===0){
    C.warrant=null; S.dossieMsg="Nenhum membro da V.I.L.E. combina com essas características."; sfx.lose();
  } else {
    C.warrant=null; S.dossieMsg=`${matches.length} suspeitos combinam: ${matches.map(m=>esc(m.nome)).join(", ")}. Você precisa de mais pistas.`; sfx.click();
  }
  save(); render();
}

function endCase(kind){
  const C=S.caso; C.status="fim"; C.result=kind;
  if(kind==="preso"){
    const before=rankIndex(S.player.solved);
    S.player.solved++;
    if(C.carmen) S.player.carmenPresa=true;
    C.promoted = rankIndex(S.player.solved)>before;
  }
  S.tab="cidade";
  save();
}

function render(){ renderInner(); if(!BUSY) setMusic(desiredMusic()); }
function renderInner(){
  const app=$("#app");
  const tabs=$("#tabs");
  if(!S.player){ tabs.classList.add("hide"); app.innerHTML=viewStart(); bindStart(); return; }
  if(!S.caso){ tabs.classList.add("hide"); app.innerHTML=viewHome(); bindHome(); return; }
  const C=S.caso;
  if(C.status==="briefing"){ tabs.classList.add("hide"); app.innerHTML=viewBriefing(); bindBriefing(); return; }
  if(C.status==="fim"){ tabs.classList.add("hide"); app.innerHTML=viewEnd(); bindEnd(); return; }
  tabs.classList.remove("hide");
  tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  let body="";
  if(S.tab==="cidade") body=viewCity();
  else if(S.tab==="dossie") body=viewDossier();
  else if(S.tab==="notas") body=viewNotes();
  else if(S.tab==="mapa") body=viewMap();
  else if(S.tab==="menu") body=viewMenu();
  app.innerHTML=header()+clock()+`<div class="fade">${body}</div>`;
  bindGame();
  if(S.fresh&&S.tab==="cidade"){S.fresh=false;typeAll();}
}

function header(){
  const p=S.player;
  return `<div class="top"><div class="brand pix" style="font-size:10px">ACME <b>•</b> DETETIVES</div>
    <div class="badge"><strong>${esc(rankOf(p.solved).nome)}</strong>${esc(p.nome)} · ${p.solved} caso${p.solved===1?"":"s"}${CLOUD.avail?"<br>"+cloudBadge():""}</div></div>`;
}
function clock(){
  const C=S.caso, pct=Math.min(100,((C.t-START_T)/(prazoOf(C)-START_T))*100);
  return `<div class="clock"><span>🕘</span><span class="t">${fmtTime(C.t)}</span>
    <div class="bar"><i style="width:${pct}%"></i></div><span class="dl">prazo: ${fmtPrazoCurto(prazoOf(C))}</span></div>`;
}

function viewStart(){
  return `<div class="card hero fade">
    <div class="logo">Agência ACME</div>
    <canvas class="banner crt" style="margin:-34px -18px 18px;width:calc(100% + 36px)" width="160" height="64" data-banner="paris" data-hour="21"></canvas>
    <h1 class="pix" style="font-size:20px;line-height:1.6">Onde Está<br><b>Carmen Sandiego?</b></h1>
    <p>A gangue V.I.L.E. está roubando tesouros pelo mundo. Siga as pistas, viaje entre cidades, descubra quem é o ladrão e consiga um mandado antes do prazo.</p>
    <div class="stack" style="max-width:340px;margin:0 auto">
      <input type="text" id="nome" maxlength="20" placeholder="Seu nome, detetive" autocomplete="off">
      <button class="btn primary wide" id="go"><span class="ic">🕵️</span><span>Registrar na ACME</span></button>
    </div></div>
    <div class="card"><h2>Como jogar</h2><ul class="list">
      <li>🔎 <b>Investigar:</b> visite os locais da cidade e ouça as testemunhas. Cada visita gasta horas.</li>
      <li>✈️ <b>Viajar:</b> use as pistas para descobrir o próximo destino do ladrão.</li>
      <li>🗂️ <b>Dossiê:</b> junte as características do suspeito e emita um mandado de prisão.</li>
      <li>⏰ Você tem de segunda 9h até domingo 17h. À noite você dorme automaticamente.</li>
      <li>🚨 Sem mandado (ou com o mandado errado), o ladrão escapa!</li></ul></div>`+cloudBox()+loadBox();
}
function bindStart(){
  const go=()=>{const n=$("#nome").value.trim()||"Detetive";S.player={nome:n,solved:0,som:true,musica:true,carmenPresa:false,v2:true};save();render();};
  $("#go").onclick=go; $("#nome").onkeydown=e=>{if(e.key==="Enter")go();};
  bindSaveLoad(); bindCloud();
}

function viewHome(){
  const p=S.player, ri=rankIndex(p.solved), r=RANKS[ri], nx=RANKS[ri+1];
  return header()+`<div class="card hero fade">
    <div class="big">🕵️</div>
    <h1 style="font-size:26px">Bem-vindo, ${esc(p.nome)}</h1>
    <p>Patente atual: <b style="color:var(--gold)">${esc(r.nome)}</b><br>
    ${nx?`Faltam ${nx.min-p.solved} prisão(ões) para virar <b>${esc(nx.nome)}</b>.`:(p.carmenPresa?"Você está no Hall da Fama da ACME!":"Só falta uma coisa: prender a própria Carmen Sandiego.")}</p>
    <button class="btn primary wide" id="novo"><span class="ic">📨</span><span>Aceitar novo caso</span></button>
    </div>
    <div class="card"><h2>Patentes da ACME</h2><ul class="list">
    ${RANKS.map((k,i)=>`<li>${i<=ri?"⭐":"▫️"} <b>${esc(k.nome)}</b><span class="c">a partir de ${k.min} prisões · rota com ${k.rota} cidades · prazo ${fmtPrazoCurto(k.prazo)}</span></li>`).join("")}</ul></div>
    <div class="row"><button class="btn" id="som"><span class="ic">${p.som?"🔊":"🔇"}</span><span>Efeitos ${p.som?"ligados":"desligados"}</span></button>
    <button class="btn" id="mus"><span class="ic">${p.musica!==false?"🎵":"🔕"}</span><span>Música ${p.musica!==false?"ligada":"desligada"}</span></button></div><div style="height:10px"></div>
    <div class="row"><button class="btn" id="reset"><span class="ic">🗑️</span><span>Novo detetive</span></button></div><div style="height:12px"></div>`+cloudBox()+saveBox()+loadBox();
}
function bindHome(){
  $("#novo").onclick=()=>{newCase();render();};
  $("#som").onclick=()=>{S.player.som=!S.player.som;save();render();};
  $("#mus").onclick=()=>{S.player.musica=S.player.musica===false;save();render();};
  $("#reset").onclick=()=>confirmBox("Apagar este detetive e todo o progresso?",()=>{S.player=null;S.caso=null;save();render();});
  bindSaveLoad(); bindCloud();
}

function viewBriefing(){
  const C=S.caso, c=CITY[C.route[0]];
  const sx=C.known.sexo==="Feminino"?"feminino":"masculino";
  return header()+`<div class="card fade city"><canvas class="banner crt" width="160" height="64" data-banner="${c.id}" data-hour="${C.t%24}" data-alarm="1"></canvas>
    <div class="who" style="color:var(--red2);font-weight:800;letter-spacing:1px;font-size:12px">📡 TRANSMISSÃO URGENTE DA ACME</div>
    <h2 style="font-size:22px;margin-top:6px">Roubo em ${esc(c.nome)}! ${c.flag}</h2>
    <p style="font-size:17px;margin-bottom:10px" data-type>Um tesouro nacional desapareceu: ${esc(C.loot)}.</p>
    ${C.carmen?`<p class="warn" style="color:var(--red2);font-weight:700;margin-bottom:10px">Os relatórios indicam que a própria Carmen Sandiego está por trás deste roubo!</p>`:""}
    <p data-type>Uma pessoa do sexo ${sx} foi vista no local do crime.</p>
    <p style="margin-top:10px">Sua missão: seguir o ladrão até o esconderijo e prendê-lo até <b>${fmtPrazoLongo(prazoOf(C))}</b>. Lembre-se: só é possível prender alguém com um <b>mandado de prisão</b>.</p>
    <p class="mute" style="margin-top:10px">Boa sorte, ${esc(rankOf(S.player.solved).nome.toLowerCase())} ${esc(S.player.nome)}.</p>
    <div style="height:14px"></div>
    <button class="btn primary wide" id="start"><span class="ic">🚀</span><span>Começar investigação</span></button></div>`;
}
function bindBriefing(){ typeAll(); setTimeout(()=>beep(880,.12,"square",.03),100); $("#start").onclick=()=>{S.caso.status="jogando";sfx.click();save();render();}; }

function viewCity(){
  const C=S.caso, c=CITY[C.cur], d=cityData(C.cur);
  const n=C.visits[C.cur]||0;
  let html=`<div class="card city"><canvas class="banner crt" width="160" height="64" data-banner="${c.id}" data-hour="${C.t%24}"></canvas><span class="flag">${c.flag}</span><h1 class="pix">${esc(c.nome)}</h1>
    <div class="country">${esc(c.pais)}${musicOn()?` · <span class="pill">♪ ${esc(themeName(c.id))}</span>`:""}</div><p>${esc(c.desc)}</p></div>`;
  html+=`<div class="card msg">${S.msg||`<div class="who">📍 Você está em ${esc(c.nome)}</div><div class="say mute">Escolha um local para investigar ou viaje para outra cidade.</div>`}</div>`;
  if(S.showTravel){
    const opts=travelOptions(C.cur);
    html+=`<h3>Para onde voar?</h3><div class="grid">`+opts.map(o=>`<button class="btn" data-go="${o}"><span class="ic">${CITY[o].flag}</span><span>${esc(CITY[o].nome)}<small>${esc(CITY[o].pais)} · ${travelHours(C.cur,o)}h de voo</small></span></button>`).join("")+
      `<button class="btn wide" id="cancel"><span>Voltar</span></button></div>`;
  } else {
    html+=`<h3>Investigar</h3><div class="grid">`+d.locs.map((L,i)=>{
      const pl=PLACE[L.pl], seen=d.seen.includes(i);
      return `<button class="btn" data-inv="${i}"><span class="ic">${pl.ic}</span><span>${esc(pl.nome)}<small>${seen?"já visitado · 1h":`${[1,2,2][n]||2}h`}</small></span></button>`;}).join("")+
      `<button class="btn primary" id="viajar"><span class="ic">✈️</span><span>Viajar<small>ver destinos</small></span></button></div>`;
    html+=`<div class="warrant ${C.warrant?"":"none"}">${C.warrant?`📜 Mandado de prisão: <b>${esc(GANG.find(x=>x.id===C.warrant).nome)}</b>`:"📜 Nenhum mandado emitido ainda. Use o Dossiê."}</div>`;
  }
  return html;
}

function viewDossier(){
  const C=S.caso, sel=S.sel||(S.sel={});
  const filt=GANG.filter(o=>TRAIT_ORDER.every(k=>!sel[k]||o[k]===sel[k]));
  let html=`<div class="card"><h2>🗂️ Computador da ACME</h2>
    <p class="mute" style="margin-bottom:12px">Selecione o que você sabe sobre o suspeito. Se só uma pessoa combinar, o mandado é emitido (custa 1h).</p>
    <div class="sel">`+TRAIT_ORDER.map(k=>`<label>${TRAITS[k].nome}</label><select data-tr="${k}"><option value="">?</option>${TRAITS[k].ops.map(o=>`<option ${sel[k]===o?"selected":""}>${o}</option>`).join("")}</select>`).join("")+
    `</div><div style="height:12px"></div>
    <div class="row"><button class="btn" id="usar"><span class="ic">📓</span><span>Usar pistas</span></button>
    <button class="btn primary" id="computar"><span class="ic">💻</span><span>Computar</span></button></div>
    ${S.dossieMsg?`<div class="warrant">${S.dossieMsg}</div>`:""}
    <div class="warrant ${C.warrant?"":"none"}">${C.warrant?`📜 Mandado ativo: <b>${esc(GANG.find(x=>x.id===C.warrant).nome)}</b>`:"📜 Sem mandado."}</div></div>`;
  html+=`<h3>Fichas da V.I.L.E. (${filt.length} de ${GANG.length} combinam)</h3><div class="crooks">`+GANG.map(o=>{
    const ok=filt.includes(o);
    const ini=o.nome.split(" ").map(w=>w[0]).slice(0,2).join("");
    return `<div class="crook ${ok?(filt.length===1?"match":""):"out"}"><span class="av" style="background:${o.cor}">${ini}</span><b>${esc(o.nome)}</b>
    ${TRAIT_ORDER.map(k=>`<span class="tag ${sel[k]&&sel[k]===o[k]?"known":""}">${o[k]}</span>`).join("")}
    <div class="mute" style="margin-top:6px;font-size:12px">${esc(o.bio)}</div></div>`;}).join("")+`</div>`;
  return html;
}

function viewNotes(){
  const C=S.caso;
  const known=TRAIT_ORDER.filter(k=>C.known[k]);
  let html=`<div class="card"><h2>📓 Caderno do detetive</h2>
    <p><b>Caso:</b> ${esc(C.loot)} (${esc(CITY[C.route[0]].nome)})</p>
    <h3>O que se sabe do suspeito</h3>
    <div>${known.map(k=>`<span class="tag known">${TRAITS[k].nome}: ${C.known[k]}</span>`).join("")}</div>
    <p class="mute" style="margin-top:8px;font-size:13px">As características são anotadas aqui automaticamente quando uma testemunha as menciona.</p></div>`;
  html+=`<div class="card"><h3 style="margin-top:0">Depoimentos</h3>`;
  if(!C.notes.length) html+=`<p class="mute">Nenhum depoimento ainda.</p>`;
  else{
    const by={};C.notes.forEach(n=>{(by[n.city]=by[n.city]||[]).push(n);});
    html+=Object.keys(by).map(cid=>`<div style="margin-bottom:10px"><b>${CITY[cid].flag} ${esc(CITY[cid].nome)}</b><ul class="list">${by[cid].map(n=>`<li>${esc(n.text)}<span class="c">${esc(n.place)}</span></li>`).join("")}</ul></div>`).join("");
  }
  html+=`</div>`;
  return html;
}

function proj(c){return {x:(c.lon+180)/360*720, y:(90-c.lat)/180*360};}
function viewMap(){
  const C=S.caso;
  let lines="";
  for(let i=1;i<C.trail.length;i++){
    const a=proj(CITY[C.trail[i-1]]),b=proj(CITY[C.trail[i]]);
    lines+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#e0393e" stroke-width="1.6" stroke-dasharray="4 3" opacity=".8"/>`;
  }
  let grid="";
  for(let x=0;x<=720;x+=60) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="360" stroke="#1b2436"/>`;
  for(let y=0;y<=360;y+=60) grid+=`<line x1="0" y1="${y}" x2="720" y2="${y}" stroke="#1b2436"/>`;
  grid+=`<line x1="0" y1="180" x2="720" y2="180" stroke="#2a3550" stroke-dasharray="2 4"/>`;
  const visited=new Set(C.trail);
  const dots=CITIES.map(c=>{const p=proj(c),cur=c.id===C.cur,v=visited.has(c.id);
    return `<g><circle cx="${p.x}" cy="${p.y}" r="${cur?6:3.2}" fill="${cur?"#f2c14e":v?"#e0393e":"#56627d"}">${cur?`<animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>`:""}</circle>
    ${(cur||v)?`<text x="${p.x+7}" y="${p.y+4}" font-size="11" fill="#e8ecf4">${esc(c.nome)}</text>`:""}</g>`;}).join("");
  return `<div class="card map"><h2>🗺️ Rota da investigação</h2>
    <svg viewBox="0 0 720 360" role="img" aria-label="Mapa da rota">${grid}${lines}${dots}</svg>
    <p class="mute" style="margin-top:10px">🟡 posição atual · 🔴 cidades visitadas · ⚪ demais cidades</p></div>
    <div class="card"><h3 style="margin-top:0">Trajeto</h3><p>${C.trail.map(id=>esc(CITY[id].nome)).join(" → ")}</p></div>`;
}

function viewMenu(){
  const p=S.player;
  return `<div class="card stack"><h2>⚙️ Menu</h2>
    <button class="btn wide" id="som"><span class="ic">${p.som?"🔊":"🔇"}</span><span>Efeitos ${p.som?"ligados":"desligados"}</span></button>
    <button class="btn wide" id="mus"><span class="ic">${p.musica!==false?"🎵":"🔕"}</span><span>Música ${p.musica!==false?"ligada":"desligada"}</span></button>
    <button class="btn wide" id="desistir"><span class="ic">🏳️</span><span>Abandonar caso</span></button>
    <button class="btn wide" id="reset"><span class="ic">🗑️</span><span>Apagar detetive</span></button>
    <p class="mute">O código abaixo guarda inclusive o caso em andamento.</p></div>`+cloudBox()+saveBox()+loadBox();
}

function viewEnd(){
  const C=S.caso, sus=GANG.find(x=>x.id===C.suspect), c=CITY[C.cur];
  const wr=C.warrant?GANG.find(x=>x.id===C.warrant):null;
  let icon,title,text;
  const o=sus.sexo==="Feminino"?"a":"o";
  if(C.result==="preso"){
    icon="🚔"; title="Ladr"+(o==="a"?"a":"ão")+" na cadeia!";
    text=`Você encurralou <b>${esc(sus.nome)}</b> em ${esc(c.nome)} e efetuou a prisão. ${esc(C.loot.charAt(0).toUpperCase()+C.loot.slice(1))} foi devolvid${/^(a|as|uma) /.test(C.loot)?"a":"o"} ao seu lugar.`;
    if(C.carmen) text+=`<br><br><b style="color:var(--gold)">Inacreditável! Você prendeu a própria Carmen Sandiego e entrou para o Hall da Fama da ACME!</b>`;
    if(C.promoted) text+=`<br><br>🎖️ <b>Promoção!</b> Sua nova patente é <b style="color:var(--gold)">${esc(rankOf(S.player.solved).nome)}</b>.`;
  } else if(C.result==="errado"){
    icon="🤦"; title="Pessoa errada!";
    text=`Seu mandado era contra <b>${esc(wr.nome)}</b>, mas quem estava escondid${o} em ${esc(c.nome)} era <b>${esc(sus.nome)}</b>. ${sus.sexo==="Feminino"?"Ela":"Ele"} fugiu enquanto você pedia desculpas.`;
  } else if(C.result==="semmandado"){
    icon="🏃"; title="Escapou!";
    text=`Você encontrou <b>${esc(sus.nome)}</b> em ${esc(c.nome)}, mas sem mandado de prisão não pôde prendê-l${o}. ${sus.sexo==="Feminino"?"Ela":"Ele"} sumiu na multidão.`;
  } else {
    icon="⌛"; title="Tempo esgotado!";
    text=`O prazo acabou. <b>${esc(sus.nome)}</b> conseguiu escapar com ${esc(C.loot)}. O esconderijo era em ${esc(CITY[C.route[C.route.length-1]].nome)}.`;
  }
  return header()+`<div class="card hero fade">${C.result==="preso"?`<canvas class="endcv" id="confetti" width="160" height="200"></canvas>`:""}<div class="big">${icon}</div><h1 class="pix" style="font-size:18px;line-height:1.6">${title}</h1><p style="color:var(--txt)">${text}</p>
    <p class="mute">Rota do ladrão: ${C.route.map(id=>esc(CITY[id].nome)).join(" → ")}</p>
    <div style="height:10px"></div>${C.result==="preso"?`<button class="btn wide" id="endCopy" style="margin-bottom:10px"><span class="ic">💾</span><span>Copiar código de salvamento</span></button><div id="endMsg" class="mute" style="margin-bottom:8px"></div>`:""}<button class="btn primary wide" id="voltar"><span class="ic">🏢</span><span>Voltar para a ACME</span></button></div>`;
}
function bindEnd(){ const ec=$("#endCopy"); if(ec) ec.onclick=async()=>{const code=(()=>{const c=S.caso;S.caso=null;const x=exportCode();S.caso=c;return x;})();
    try{await navigator.clipboard.writeText(code);$("#endMsg").textContent="Código copiado! Guarde em um lugar seguro.";}catch(e){$("#endMsg").textContent="Não deu para copiar aqui. Use Menu → Salvar progresso.";}}; const cf=$("#confetti"); if(cf) confetti(cf); $("#voltar").onclick=()=>{S.caso=null;S.msg=null;S.sel=null;S.dossieMsg=null;save();render();}; }

function confirmBox(text,yes){
  $("#modal").innerHTML=`<div class="modal"><div class="card fade"><p style="margin-bottom:14px">${esc(text)}</p>
    <div class="row"><button class="btn" id="mno"><span>Cancelar</span></button><button class="btn primary" id="myes"><span>Confirmar</span></button></div></div></div>`;
  $("#mno").onclick=()=>{$("#modal").innerHTML="";};
  $("#myes").onclick=()=>{$("#modal").innerHTML="";yes();};
}

function bindGame(){
  document.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>investigate(+b.dataset.inv));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>travel(b.dataset.go));
  const v=$("#viajar"); if(v) v.onclick=()=>{S.showTravel=true;sfx.click();render();};
  const cc=$("#cancel"); if(cc) cc.onclick=()=>{S.showTravel=false;render();};
  document.querySelectorAll("[data-tr]").forEach(s=>s.onchange=()=>{S.sel[s.dataset.tr]=s.value||undefined;S.dossieMsg=null;render();});
  const u=$("#usar"); if(u) u.onclick=()=>{S.sel=Object.assign({},S.caso.known);S.dossieMsg=null;sfx.click();render();};
  const cp=$("#computar"); if(cp) cp.onclick=()=>computeWarrant(S.sel||{});
  const so=$("#som"); if(so) so.onclick=()=>{S.player.som=!S.player.som;save();render();};
  const mu=$("#mus"); if(mu) mu.onclick=()=>{S.player.musica=S.player.musica===false;save();render();};
  const de=$("#desistir"); if(de) de.onclick=()=>confirmBox("Abandonar este caso? O ladrão vai escapar.",()=>{S.caso=null;S.msg=null;S.sel=null;S.dossieMsg=null;save();render();});
  bindSaveLoad(); bindCloud();
  const rs=$("#reset"); if(rs) rs.onclick=()=>confirmBox("Apagar este detetive e todo o progresso?",()=>{S.player=null;S.caso=null;save();render();});
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;S.showTravel=false;if(S.tab!=="cidade"){} sfx.click();render();window.scrollTo(0,0);});

load();
render();
cloudInit();
</script>
</body>
</html>
